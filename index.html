<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XG Demos</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b0c0e; color: #f3f2ee; margin: 0; padding: 2rem; }
  h1 { font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
  .card { background: #141518; border-radius: 12px; overflow: hidden; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card a { display: block; padding: 1rem; color: #c5c8d0; text-decoration: none; font-weight: 500; }
  .card a:hover { color: #fff; }
</style>
</head>
<body>
<h1>XG Demos</h1>
<p>Landings de cursos de importaciones</p>
<div class="grid">
  <div class="card">
    <img src="xg1.png" alt="XG1">
    <a href="https://xg1-omega.vercel.app/" target="_blank">XG1 — Curso Experto en Importaciones</a>
  </div>
  <div class="card">
    <img src="xg2.png" alt="XG2">
    <a href="https://xg2-mu.vercel.app/" target="_blank">XG2 — Curso Premium</a>
  </div>
  <div class="card">
    <img src="xg3.png" alt="XG3">
    <a href="https://xg3.vercel.app/" target="_blank">XG3 — Importa con Éxito</a>
  </div>
</div>
</body>
</html>
